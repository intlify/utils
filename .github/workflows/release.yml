name: Release

# Triggers:
#   - tag push (v*): publish to npm, then create the GitHub Release once it
#     succeeds.
#   - workflow_dispatch: recover an existing tag by running one job
#     (npm-publish / release-notes) or both. A version that is already
#     published is skipped, so `all` is safe to re-run.
#
# CHANGELOG.md is already part of the tagged release commit made by
# `pnpm release` (see bump.config.ts). This workflow never writes or commits files.
on:
  push:
    branches-ignore:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v2.0.0 or v2.0.0-beta.0)
        type: string
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions: {}

jobs:
  npm-publish:
    if: >-
      github.event_name == 'push' || (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publisher (OIDC)
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Resolve dist-tag from tag
        id: meta
        # A prerelease goes to its first identifier (`beta` for v2.0.0-beta.0), or to
        # `next` when that starts with a digit, since npm rejects a dist-tag that looks
        # like a semver range. Only a stable release moves `latest`.
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][0-9A-Za-z-]*) ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        # pnpm 11 and later publish without the npm CLI, so npm only checks
        # whether the version is already published (`npm view`). setup-node
        # caches by the `packageManager` field by default, so turn it off for a
        # release.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Publish to npm
        # pnpm publish replaces `catalog:` specifiers in the packed package.json.
        # Under OIDC trusted publishing, it attaches provenance on its own, so no
        # token or provenance setting is needed (pnpm 11 and later do not read
        # `NPM_CONFIG_*` environment variables).
        # Skip a version that is already on npm, so that a retry is idempotent.
        # npm does not serve a new version until its malware scan ends, so do not
        # retry this job right after a publish.
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@intlify/utils@$version" version > /dev/null 2>&1; then
            echo "↺ @intlify/utils@$version is already on npm, skipping"
          else
            pnpm publish --access public --no-git-checks --tag "$DIST_TAG"
          fi
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}

  release-notes:
    needs:
      - npm-publish
    if: >-
      always() && (
        (github.event_name == 'push' && needs.npm-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release (idempotent)
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            # SemVer prerelease: '-' right after major.minor.patch, not build metadata
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
