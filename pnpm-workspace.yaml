packages:
  - playground/**

catalogs:
  vitest:
    vitest: 5.0.5
    '@vitest/coverage-v8': 5.0.5
    vite: npm:@voidzero-dev/vite-plus-core@1.4.0
    vite-plus: 1.4.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # the shared lint and format config of the maintainer
  - '@kazupon/vp-config'

onlyBuiltDependencies:
  - esbuild
overrides:
  vite@*: catalog:vitest
  vitest@*: catalog:vitest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
