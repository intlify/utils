packages:
  - playground/**

catalogs:
  vitest:
    vitest: 5.1.0
    '@vitest/coverage-v8': 5.1.0
    vite: npm:@voidzero-dev/vite-plus-core@1.5.0
    vite-plus: 1.5.0

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # the shared lint and format config of the maintainer
  - '@kazupon/vp-config'

allowBuilds:
  esbuild: true
overrides:
  vite@*: catalog:vitest
  vitest@*: catalog:vitest
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: '*'
    vitest: '*'
packageExtensions:
  # the API docs generation of vitepress-api-references does not load vitepress
  vitepress-api-references:
    peerDependenciesMeta:
      vitepress:
        optional: true
